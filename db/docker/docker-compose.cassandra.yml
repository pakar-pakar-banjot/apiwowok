services:
  cassandra:
    image: cassandra:5.0.9
    container_name: nusafire-cassandra-dev
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: nusafire-dev
      CASSANDRA_DC: dc1
      CASSANDRA_RACK: rack1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      # Diverifikasi di /etc/cassandra/cassandra-env.sh (5.0.9): G1GC aktif,
      # sehingga hanya MAX_HEAP_SIZE yang diset (HEAP_NEWSIZE dibiarkan kosong).
      MAX_HEAP_SIZE: "1G"
    mem_limit: 2g
    cpus: "2.0"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  cassandra_data:
