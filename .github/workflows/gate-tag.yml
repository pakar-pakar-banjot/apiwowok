# AGENTS.md §5a: when a gate is approved in the tracker, tag main (g<N>-approved) and close the phase milestone.
name: gate-tag
on:
  push:
    branches: [main]
    paths: [docs/10-execution-plan/13-progress-tracker.md]
  workflow_dispatch:
permissions:
  contents: write
  issues: write
jobs:
  gate-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const text = fs.readFileSync('docs/10-execution-plan/13-progress-tracker.md', 'utf8');
            const line = (text.match(/^Gerbang disetujui:(.*)$/m) || [, ''])[1];
            const gates = [...line.matchAll(/GATE-G(\d)/g)].map(m => m[1]);
            const { owner, repo } = context.repo;
            const ms = await github.paginate(github.rest.issues.listMilestones, { owner, repo, state: 'all' });
            for (const n of gates) {
              const tag = `g${n}-approved`;
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                core.info(`${tag} sudah ada`);
              } catch {
                await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${tag}`, sha: context.sha });
                core.info(`${tag} dibuat di ${context.sha}`);
              }
              const m = ms.find(x => x.title.startsWith(`P${n} `));
              if (m && m.state === 'open') {
                await github.rest.issues.updateMilestone({ owner, repo, milestone_number: m.number, state: 'closed' });
                core.info(`Milestone ${m.title} ditutup`);
              }
            }
